<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bianca vs Burnout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: tela de fliperama centralizada; no celular os controles ficam embaixo (retrato) ou por cima (paisagem) */
:root{
  --bg:#140c1c; --panel:#2a1b36; --ink:#f6e7d3; --dim:#a08aa8; --red:#d7263d; --gold:#f2c14e;
  --font:"Press Start 2P", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);box-sizing:border-box;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;box-shadow:0 0 0 3px var(--panel),0 0 0 5px #000;touch-action:none;max-width:100%;cursor:pointer}
#bar{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;font-size:8px;line-height:2;color:var(--dim);text-align:center}
#bar kbd{font-family:var(--font);color:var(--ink);background:var(--panel);padding:2px 5px;border-radius:2px}
#mute{font-family:var(--font);font-size:8px;background:var(--panel);color:var(--ink);border:2px solid #000;padding:6px 8px;cursor:pointer}
#mute:focus-visible,.tb:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#touch{display:none;justify-content:space-between;align-items:flex-end;gap:12px}
body.touch #touch{display:flex}
body.touch #keys{display:none}
.dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,46px);gap:3px}
.acts{display:grid;grid-template-columns:repeat(2,76px);grid-template-rows:repeat(2,46px);gap:8px}
.tb{font-family:var(--font);background:var(--panel);color:var(--ink);border:2px solid #000;border-radius:8px;font-size:8px;touch-action:none;padding:0;-webkit-tap-highlight-color:transparent}
.tb.on{background:var(--red)}
.tb.sp{color:var(--gold)}
@media (orientation:landscape) and (max-height:520px){
  body{padding-block:6px;gap:6px}
  body.touch #touch{position:fixed;left:0;right:0;bottom:0;pointer-events:none;
    padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  body.touch .tb{pointer-events:auto;opacity:.72}
}
</style>

<div id="stage"><canvas id="screen" width="320" height="180" aria-label="Jogo Bianca vs Burnout"></canvas></div>
<div id="bar">
  <span id="keys"><kbd>←↑↓→</kbd> andar &nbsp; <kbd>J</kbd> soco &nbsp; <kbd>K</kbd> chute &nbsp; <kbd>L</kbd> joelhada &nbsp; <kbd>Espaço</kbd> especial</span>
  <button id="mute" type="button">SOM: LIGADO</button>
</div>
<div id="touch">
  <div class="dpad">
    <button class="tb" data-k="u" style="grid-area:1/2" aria-label="cima">▲</button>
    <button class="tb" data-k="l" style="grid-area:2/1" aria-label="esquerda">◀</button>
    <button class="tb" data-k="r" style="grid-area:2/3" aria-label="direita">▶</button>
    <button class="tb" data-k="d" style="grid-area:3/2" aria-label="baixo">▼</button>
  </div>
  <div class="acts">
    <button class="tb" data-k="a">SOCO</button>
    <button class="tb" data-k="b">CHUTE</button>
    <button class="tb" data-k="c">JOELHO</button>
    <button class="tb sp" data-k="s">ESPECIAL</button>
  </div>
</div>

<script>
// ================= TEXTOS (pode editar aqui) =================
const MENSAGEM = "Obrigada por ser a melhor namorada do mundo!";
const ASSINATURA = "Com amor, Isabel";
// Cada fala é [quem fala, texto]. Mantenha a mesma quantidade de falas em cada bloco.
const TXT = {
  intro: [
    ["", "Isabel estava estudando e trabalhando havia 14 horas seguidas..."],
    ["ISABEL", "Só mais um capítulo... mais um e-mail... mais uma reunião..."],
    ["BURNOUT", "Hahaha! Nem lembra a última vez que descansou, né?"],
    ["BURNOUT", "Você vem comigo para a Torre do Burnout!"],
    ["BIANCA", "Ei! Solta a minha namorada!"],
    ["BIANCA", "Aguenta firme, vida. Tô indo te buscar."],
  ],
  boss: [
    ["BURNOUT", "Você de novo? Ela tem prova E reunião! Não tem tempo pra namorar!"],
    ["ISABEL", "Mô!! Me tira daqui!"],
    ["BIANCA", "Ela tem tempo pra descansar. E pra mim."],
    ["BURNOUT", "Então vem!"],
  ],
  fim: [
    ["ISABEL", "Você veio me buscar!"],
    ["BIANCA", "Sempre. Chega de estudo e trabalho por hoje."],
    ["ISABEL", "Sabe que dia é hoje?"],
    ["BIANCA", "Hmm... dia de descansar?"],
    ["ISABEL", "Hoje a gente faz 2 anos de namoro, my love!"],
  ],
};
const DICAS = [
  "Dica: aperte soco 3 vezes para o combo com cotovelada.",
  "Dica: se uma reunião te prender, aperte os botões rápido para sair.",
  "Dica: a joelhada voadora é o golpe mais forte.",
];
// =============================================================

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- entrada (teclado + toque) ----------
const K = {}, P = {};
const MAP = {ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',
  KeyJ:'a',KeyZ:'a',KeyK:'b',KeyX:'b',KeyL:'c',KeyC:'c',Space:'s',KeyV:'s',Enter:'ok',Escape:'esc',KeyR:'rs'};
addEventListener('keydown', e => {
  if (e.code === 'KeyM') { toggleMute(); return; }
  const k = MAP[e.code]; if (!k) return;
  e.preventDefault(); audioInit();
  if (!K[k]) P[k] = true; K[k] = true;
});
addEventListener('keyup', e => { const k = MAP[e.code]; if (k) K[k] = false; });
addEventListener('blur', () => { for (const k in K) K[k] = false; });

if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) document.body.classList.add('touch');
addEventListener('touchstart', () => document.body.classList.add('touch'), {once: true, passive: true});

document.querySelectorAll('.tb').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); audioInit(); try { b.setPointerCapture(e.pointerId); } catch (_) {}
    if (!K[k]) P[k] = true; K[k] = true; b.classList.add('on'); };
  const up = () => { K[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

// ---------- som (WebAudio, chiptune feito na hora) ----------
let AC = null, master = null, muted = false, noiseBuf = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(AC.destination);
  } catch (_) { AC = null; }
}
function toggleMute() {
  muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5;
  document.getElementById('mute').textContent = muted ? 'SOM: DESLIGADO' : 'SOM: LIGADO';
}
document.getElementById('mute').addEventListener('click', () => { audioInit(); toggleMute(); });

function tone(freq, dur, type = 'square', vol = .15, slide = 0, when = 0) {
  if (!AC) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(gn).connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol = .2, hp = 800, when = 0) {
  if (!AC) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate * .6, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + when, s = AC.createBufferSource(), f = AC.createBiquadFilter(), gn = AC.createGain();
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f).connect(gn).connect(master); s.start(t); s.stop(t + dur);
}
const SFX = {
  swing: () => noise(.07, .1, 2600),
  hit: () => { noise(.09, .28, 500); tone(180, .09, 'square', .12, -90); },
  big: () => { noise(.16, .34, 220); tone(120, .16, 'square', .18, -60); },
  hurt: () => tone(320, .25, 'sawtooth', .13, -220),
  ko: () => tone(420, .3, 'square', .1, -320),
  pick: () => { tone(660, .08, 'square', .1); tone(990, .14, 'square', .1, 0, .08); },
  special: () => { for (let i = 0; i < 7; i++) tone(300 + i * 110, .1, 'square', .09, 0, i * .05); },
  blip: () => tone(900, .03, 'square', .04),
  boom: () => { noise(.6, .38, 90); tone(80, .5, 'triangle', .3, -40); },
  throw: () => tone(500, .12, 'triangle', .1, 300),
  ring: () => { for (let i = 0; i < 6; i++) tone(i % 2 ? 1500 : 1300, .05, 'square', .05, 0, i * .06); },
  launch: () => tone(260, .45, 'triangle', .07, 600),
  pop: () => noise(.45, .16, 1400),
};

// músicas: uma nota por colcheia, "." = pausa
const NOTE = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function seq(s) {
  return s.split(/\s+/).filter(x => x && x !== '|').map(n => {
    if (n === '.') return 0;
    const m = n.match(/^([A-G]#?)(\d)$/); const midi = 12 * (+m[2] + 1) + NOTE[m[1]];
    return 440 * Math.pow(2, (midi - 69) / 12);
  });
}
const SONGS = {
  title: {bpm: 112,
    L: seq('E5 . G5 . A5 . G5 E5 | D5 . E5 . C5 . . . | E5 . G5 . A5 . C6 . | B5 . A5 . G5 . . .'),
    B: seq('C3 . G3 . C3 . G3 . | A2 . E3 . A2 . E3 . | F2 . C3 . F2 . C3 . | G2 . D3 . G2 . D3 .')},
  fight: {bpm: 150,
    L: seq('A4 . C5 A4 D5 . C5 A4 | G4 . A4 . E4 . G4 . | A4 . C5 A4 D5 . E5 . | D5 C5 A4 . G4 . A4 .'),
    B: seq('A2 A2 A3 A2 A2 A2 A3 A2 | G2 G2 G3 G2 G2 G2 G3 G2 | F2 F2 F3 F2 F2 F2 F3 F2 | E2 E2 E3 E2 E2 E2 G#2 E2')},
  boss: {bpm: 164,
    L: seq('E4 . E4 F4 E4 . D4 . | E4 . G4 . F4 E4 D4 . | E4 . E4 F4 G4 . A4 . | B4 . A4 G4 F4 . E4 .'),
    B: seq('E2 E2 E3 E2 E2 E2 E3 E2 | E2 E2 E3 E2 D2 D2 D3 D2 | C2 C2 C3 C2 C2 C2 C3 C2 | B1 B1 B2 B1 B1 B1 B2 B1')},
  party: {bpm: 140,
    L: seq('C5 E5 G5 E5 C6 . G5 . | A5 . G5 E5 F5 . D5 . | E5 G5 C6 G5 A5 . F5 . | G5 E5 D5 B4 C5 . . .'),
    B: seq('C3 G2 C3 G2 C3 G2 C3 G2 | F2 C3 F2 C3 G2 D3 G2 D3 | C3 G2 C3 G2 F2 C3 F2 C3 | G2 D3 G2 D3 C3 G2 C3 .')},
};
let song = null, songKey = '', step = 0, nextT = 0;
function playSong(k) {
  if (songKey === k) return;
  songKey = k; song = k ? SONGS[k] : null; step = 0; if (AC) nextT = AC.currentTime + .05;
}
setInterval(() => {
  if (!AC || !song || muted) return;
  if (nextT < AC.currentTime) nextT = AC.currentTime + .05;
  const dt = 60 / song.bpm / 2;
  while (nextT < AC.currentTime + .15) {
    const l = song.L[step % song.L.length], b = song.B[step % song.B.length], w = nextT - AC.currentTime;
    if (l) tone(l, dt * .9, 'square', .04, 0, w);
    if (b) tone(b, dt * .95, 'triangle', .09, 0, w);
    nextT += dt; step++;
  }
}, 25);

// ---------- desenho em pixel ----------
const W = 320, H = 180;
const cv = document.getElementById('screen'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
function R(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function hash(n) { n = Math.imul(n ^ 61 ^ (n >>> 16), 9); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return n >>> 0; }
const rnd = n => Math.floor(Math.random() * n);
const rr = (a, b) => a + Math.random() * (b - a);
const pick = a => a[rnd(a.length)];
// espelha o desenho conforme o lado para onde o personagem olha
const mk = (x, y, f) => (dx, dy, w, h, c) => R(f > 0 ? x + dx : x - dx - w + 1, y + dy, w, h, c);
function disc(cx, cy, r, c) { for (let j = -r; j <= r; j++) { const w = Math.floor(Math.sqrt(r * r - j * j)); R(cx - w, cy + j, w * 2 + 1, 1, c); } }
function spr(x, y, rows, pal) {
  for (let j = 0; j < rows.length; j++) for (let i = 0; i < rows[j].length; i++) { const c = pal[rows[j][i]]; if (c) R(x + i, y + j, 1, 1, c); }
}
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }
function grad(a, b, n) { return Array.from({length: n}, (_, i) => mix(a, b, i / (n - 1))); }

const FONT = '"Press Start 2P", ui-monospace, monospace';
function txt(s, x, y, c = '#f6e7d3', size = 8, align = 'left', shadow = '#000') {
  g.font = `${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'top';
  if (shadow) { g.fillStyle = shadow; g.fillText(s, Math.round(x) + 1, Math.round(y) + 1); }
  g.fillStyle = c; g.fillText(s, Math.round(x), Math.round(y));
}
function wrap(s, maxW, size = 8) {
  g.font = `${size}px ${FONT}`; const out = []; let line = '';
  for (const w of s.split(' ')) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
  if (line) out.push(line); return out;
}

// ---------- as duas: paletas ----------
function hairShort(px, o, b, c1, c2) { // cabelo curto cacheado
  // volume de cachos no topo, laterais e nuca curtas, franja caindo na testa
  px(-4 + o, -28 + b, 8, 3, c1); px(-3 + o, -29 + b, 7, 1, c1);
  px(-2 + o, -30 + b, 2, 1, c1); px(1 + o, -30 + b, 2, 1, c1); px(-5 + o, -27 + b, 1, 2, c1); px(4 + o, -28 + b, 1, 3, c1);
  px(2 + o, -25 + b, 2, 1, c1); px(-4 + o, -25 + b, 2, 2, c1); px(-3 + o, -23 + b, 1, 1, c1);
  px(-2 + o, -29 + b, 1, 1, c2); px(1 + o, -28 + b, 1, 1, c2); px(-4 + o, -27 + b, 1, 1, c2); px(3 + o, -27 + b, 1, 1, c2); px(2 + o, -25 + b, 1, 1, c2);
  px(-1 + o, -21 + b, 1, 1, '#c9ced6'); // alargador
}
function hairLong(px, o, b, c1, c2) { // cacheado até o ombro
  px(-4 + o, -28 + b, 8, 3, c1); px(-3 + o, -29 + b, 6, 1, c1); px(-5 + o, -27 + b, 4, 8, c1); px(-6 + o, -26 + b, 1, 6, c1);
  px(-7 + o, -24 + b, 1, 2, c1); px(-5 + o, -19 + b, 3, 1, c1);
  px(3 + o, -27 + b, 2, 3, c1); px(-1 + o, -25 + b, 1, 2, c1);
  px(-3 + o, -27 + b, 1, 1, c2); px(-5 + o, -23 + b, 1, 1, c2); px(0 + o, -28 + b, 1, 1, c2); px(-6 + o, -22 + b, 1, 1, c2);
}
const BIA = {skin:'#c48a5e', skinD:'#a56e47', hair:'#141016', hairL:'#3b3142', top:'#4a5a2a', topD:'#4a5a2a', mid:'#4a5a2a',
  shorts:'#5f6b35', trim:'#c8b77a', leg:'#c48a5e', foot:'#c48a5e', arm:'#c48a5e', glove:'#a3172a', band:'#c8b77a', camo:['#33401c', '#6b5a36', '#9a9a62'], glasses:'#c27a2c', hairFn: hairShort};
const ISA = {skin:'#f2cfae', skinD:'#d9a985', hair:'#4a2a1c', hairL:'#73462f', top:'#3f8f7f', topD:'#2f6e61', mid:'#3f8f7f',
  shorts:'#3d5a99', trim:null, leg:'#3d5a99', foot:'#eeeeee', arm:'#3f8f7f', glove:null, band:null, hairFn: hairLong};

// poses: braço = [cotovelo x,y, mão x,y] a partir do ombro; perna = [joelho x,y a partir do quadril, pé x,y a partir do chão]
const PO = {
  idle0:{fa:[3,4,5,-3], ba:[2,5,3,-4], fl:[3,5,5,0], bl:[-2,5,-4,0]},
  idle1:{bob:1, fa:[3,4,5,-2], ba:[2,5,3,-3], fl:[3,4,5,0], bl:[-2,4,-4,0]},
  walk0:{fa:[3,4,5,-3], ba:[2,5,3,-4], fl:[3,5,6,0], bl:[-2,5,-5,0]},
  walk1:{bob:1, fa:[3,4,5,-2], ba:[2,5,3,-3], fl:[1,5,1,0], bl:[0,4,-1,-2]},
  jab:{lean:1, fa:[5,-1,10,-2], ba:[2,5,3,-4], fl:[4,5,6,0], bl:[-2,5,-5,0]},
  elbow:{lean:2, fa:[3,4,4,-4], ba:[8,-2,4,-5], fl:[4,5,6,0], bl:[-2,5,-5,0]},
  kickW:{lean:-1, fa:[3,4,5,-3], ba:[-2,3,-3,5], fl:[2,5,2,0], bl:[3,1,-1,-4]},
  kick:{lean:-2, fa:[3,4,4,-4], ba:[-3,3,-6,4], fl:[1,5,0,0], bl:[6,-4,13,-15]},
  knee:{lean:-1, fa:[4,-3,7,-6], ba:[3,-3,6,-5], fl:[1,5,0,0], bl:[6,-5,5,-4]},
  hurt:{lean:-2, fa:[2,4,-1,7], ba:[-2,3,-5,1], fl:[2,5,3,0], bl:[-2,5,-5,0]},
  down:{bob:4, lean:1, fa:[2,5,4,9], ba:[1,5,2,9], fl:[4,2,5,0], bl:[-2,6,-7,0]},
  win:{fa:[1,-4,2,-10], ba:[-1,-4,-2,-10], fl:[2,5,3,0], bl:[-2,5,-3,0]},
  hug:{lean:1, fa:[4,1,8,-1], ba:[4,1,8,1], fl:[2,5,3,0], bl:[-2,5,-3,0]},
  sad:{bob:1, fa:[1,5,1,9], ba:[-1,5,-1,9], fl:[1,5,1,0], bl:[-1,5,-1,0]},
  stand:{fa:[1,5,1,9], ba:[-1,5,-1,9], fl:[1,5,2,0], bl:[-1,5,-2,0]},
  swalk0:{fa:[2,5,3,9], ba:[-2,5,-3,9], fl:[2,5,4,0], bl:[-2,5,-4,0]},
  swalk1:{bob:1, fa:[1,5,1,9], ba:[-1,5,-1,9], fl:[1,5,1,0], bl:[0,4,-1,-2]},
  wave:{fa:[3,-3,4,-9], ba:[-1,5,-1,9], fl:[1,5,2,0], bl:[-1,5,-2,0]},
  sit:{bob:3, lean:1, fa:[3,3,8,3], ba:[2,4,7,4], fl:[6,0,7,0], bl:[5,1,5,0]},
};
function head(px, o, b, S, opt) {
  px(-3 + o, -26 + b, 7, 7, S.skin); px(-3 + o, -20 + b, 7, 1, S.skinD);
  if (opt.blink) px(2 + o, -22 + b, 1, 1, '#0d0a0e'); else px(2 + o, -23 + b, 1, 2, '#0d0a0e');
  if (opt.blush) px(0 + o, -21 + b, 2, 1, '#e0806e');
  if (opt.smile) px(2 + o, -21 + b, 2, 1, '#6a2626');

  const lines = wrap(MENSAGEM, W - 36);
  lines.forEach((l, i) => txt(l, W / 2, 136 + i * 11, '#f6e7d3', 8, 'center'));
  txt(ASSINATURA, W - 18, 136 + lines.length * 11 + 1, '#f2c14e', 8, 'right');
  tiny('E CLAUDE RS', W - 18, 136 + lines.length * 11 + 11, '#a08aa8');
}
function render() {
  g.setTransform(1, 0, 0, 1, 0, 0); R(0, 0, W, H, '#000');
  const sh = G.shake > .5 ? G.shake : 0;
  g.setTransform(1, 0, 0, 1, Math.round(rr(-sh, sh) / 2), Math.round(rr(-sh, sh) / 2));
  switch (G.scene) {
    case 'title': drawTitle(); break;
    case 'cs': renderWorld(); g.setTransform(1, 0, 0, 1, 0, 0); dialog(); break;
    case 'card': drawCard(); break;
    case 'play': renderWorld(); g.setTransform(1, 0, 0, 1, 0, 0); hud(); break;
    case 'gameover':
      renderWorld(); g.setTransform(1, 0, 0, 1, 0, 0); R(0, 0, W, H, 'rgba(10,5,20,.78)');
      txt('A BIANCA PRECISA', W / 2, 60, '#f6e7d3', 8, 'center'); txt('DE UM RESPIRO...', W / 2, 74, '#f6e7d3', 8, 'center');
      if (G.goT > 50 && (G.t >> 4) & 1) txt('APERTE PARA TENTAR DE NOVO', W / 2, 110, '#f2c14e', 8, 'center');
      break;
    case 'party': drawParty(); break;
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (G.flash > 0) { g.globalAlpha = Math.min(1, G.flash / 12) * (REDUCED ? .25 : .8); R(0, 0, W, H, '#ffffff'); g.globalAlpha = 1; }
}

// ---------- tela e laço principal ----------
function fit() {
  const s = document.getElementById('stage'), w = s.clientWidth, h = s.clientHeight;
  let k = Math.min(w / W, h / H); if (k >= 3) k = Math.floor(k); k = Math.max(k, .5);
  cv.style.width = Math.floor(W * k) + 'px'; cv.style.height = Math.floor(H * k) + 'px';
}
addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.getElementById('stage'));
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  const r = cv.getBoundingClientRect(); G.tapX = (e.clientX - r.left) / r.width * W; G.tapY = (e.clientY - r.top) / r.height * H; P.tap = true;
});
let acc = 0, last = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now; let n = 0;
  while (acc >= 1000 / 60 && n < 5) { update(); acc -= 1000 / 60; n++; for (const k in P) P[k] = false; }
  render(); requestAnimationFrame(frame);
}
function boot() { fit(); playSong('title'); requestAnimationFrame(t => { last = t; frame(t); }); }
if (document.fonts && document.fonts.load) Promise.race([document.fonts.load('8px "Press Start 2P"'), new Promise(r => setTimeout(r, 2500))]).then(boot, boot);
else boot();
</script>
